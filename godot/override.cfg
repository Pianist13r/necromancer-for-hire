; Главное окно стартует за пределами экрана и без фокуса, чтобы агентные прогоны
; (--shot, --demo, --write-movie) не всплывали у владельца. Запуск владельца (без --mute)
; автолоад AgentWindow сразу возвращает в центр экрана. См. scripts/dev/agent_window.gd.
;
; Запись промо движком (tools/promo/record.py): размер кадра Movie Maker берётся из
; window_*_override, а их кладёт только песочница записи — файл user://movie_override.cfg в
; своём APPDATA. У владельца и в гейте файла нет, настройка ничего не меняет.

[application]

config/project_settings_override="user://movie_override.cfg"

[display]

window/size/mode=1
window/size/initial_position_type=0
window/size/initial_position=Vector2i(-32000, -32000)
window/size/no_focus=true

[autoload]

AgentWindow="*res://scripts/dev/agent_window.gd"
